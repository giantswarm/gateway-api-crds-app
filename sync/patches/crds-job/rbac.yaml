{{- if include "gateway-api-crds.selectedFiles" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gateway-api-crds.installerName" . }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
  labels:
    {{- include "gateway-api-crds.labels" . | nindent 4 }}
rules:
# No "delete": the installer never prunes CRDs. Removing a CRD from the chart stops it from
# being applied, it never removes it from the cluster.
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - create
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gateway-api-crds.installerName" . }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-2"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
  labels:
    {{- include "gateway-api-crds.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gateway-api-crds.installerName" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "gateway-api-crds.installerName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
