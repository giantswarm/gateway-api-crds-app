version: 2.1
orbs:
  architect: giantswarm/architect@9.6.0

workflows:
  package-and-push-chart-on-tag:
    jobs:
    - architect/push-to-registries:
        context: architect
        name: push-crd-image-to-registries
        image: giantswarm/gateway-api-crds
        split-china-push: true
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
            - main
            - master

    - architect/sync-china-registry:
        context: architect
        name: sync-china-registry
        image: giantswarm/gateway-api-crds
        requires:
        - push-crd-image-to-registries
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /^.*$/

    - architect/push-to-app-catalog:
        context: architect
        executor: app-build-suite
        name: package-and-push-chart
        app_catalog: giantswarm-catalog
        app_catalog_test: giantswarm-test-catalog
        chart: gateway-api-crds
        # The chart's appVersion tracks the upstream CRD versions, not the chart release.
        override_app_version: false
        # Share the version resolved by the image job so the chart cannot point at an image
        # tag that was never pushed.
        attach_workspace: true
        # The installer Job pulls the CRD image, so the image must exist first.
        requires:
        - push-crd-image-to-registries
          # Trigger job on git tag.
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
            - main
            - master
